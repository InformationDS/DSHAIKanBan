# AIKanBan bundle for DeepSeek Harness (dsh).
#
# Inserted into a profile's composition once this bundle is installed into that
# profile (`dsh plugin --profile <name> add <spec>`). The plugin row resolves
# the package **by name** through the profile's node_modules, or **by path**
# when the entry is written as a relative/absolute path — the DSH boot layer
# converts any `./`-prefixed or absolute `name` into a `file:` URL anchored
# beside this file (see `anchorInsertedPluginNames` in @deepseek-ai/dsh-app-boot).
#
# The host half is `package.json#main` (lib/index.js, plain ESM);
# the browser half is `exports["./client"]` (lib/client.js) and is picked up
# automatically because package.json declares `dsh.client.platform === "web"`.
- insert:
    - id: aikanban
      name: '@aikanban/dsh-aikanban'
