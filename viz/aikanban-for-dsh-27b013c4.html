<div id="ab-root">
  <div class="ab-head">
    <div class="ab-head-left">
      <div class="ab-proj">📋 dsh-plugin · AIKanBan 看板</div>
      <div class="ab-sub">任务分配给对话完成 · 项目记忆 V2 · 2 条待审核建议</div>
    </div>
    <div class="ab-head-right">
      <button class="btn btn-primary" id="ab-new">＋ 新建工作项</button>
      <button class="btn btn-ghost" id="ab-handoff">生成交接上下文</button>
    </div>
  </div>
  <div id="ab-board" class="ab-board"></div>
  <div id="ab-detail" hidden></div>
</div>
<style>
#ab-root { font-size: 13px; font-family: inherit; }
.ab-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.ab-proj { font-size: 16px; font-weight: 600; color: var(--foreground); }
.ab-sub { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }
.ab-head-right { display: flex; gap: 8px; flex-wrap: wrap; }
.ab-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(186px, 1fr)); gap: 10px; align-items: start; }
.ab-col { background: light-dark(rgba(0,0,0,.035), rgba(255,255,255,.045)); border: 1px solid var(--border); border-radius: 10px; padding: 8px; min-height: 90px; }
.ab-col-head { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--foreground); font-size: 12px; margin-bottom: 8px; }
.ab-col-count { color: var(--muted-foreground); font-weight: 400; }
.ab-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ab-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 9px; margin-bottom: 8px; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
.ab-card:hover { transform: translateY(-1px); box-shadow: 0 3px 12px light-dark(rgba(0,0,0,.12), rgba(0,0,0,.5)); }
.ab-card-title { font-weight: 600; color: var(--card-foreground); margin-bottom: 3px; }
.ab-card-goal { color: var(--muted-foreground); font-size: 12px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ab-card-foot { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11px; color: var(--muted-foreground); }
.ab-pill { border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; line-height: 18px; font-size: 11px; color: var(--muted-foreground); background: transparent; }
.ab-pill.warn { border-color: light-dark(#f59e0b, #b45309); color: light-dark(#b45309, #fbbf24); }
.ab-blocked { color: light-dark(#b91c1c, #f87171); font-size: 12px; margin-top: 4px; }
.ab-detail { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; }
@media (max-width: 680px) { .ab-detail { grid-template-columns: 1fr; } }
.ab-panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.ab-panel h4 { margin: 0 0 8px; font-size: 13px; color: var(--foreground); }
.ab-back { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ab-kv { margin-bottom: 8px; }
.ab-kv .k { color: var(--muted-foreground); font-size: 11px; }
.ab-kv .v { color: var(--card-foreground); font-size: 13px; white-space: pre-wrap; }
.ab-status-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.ab-conv { border-left: 2px solid var(--border); padding: 2px 0 10px 10px; margin-left: 4px; }
.ab-conv:last-child { padding-bottom: 2px; }
.ab-conv-title { font-weight: 600; color: var(--card-foreground); font-size: 13px; }
.ab-conv-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 11px; color: var(--muted-foreground); align-items: center; }
.ab-mem-line { font-size: 12px; color: var(--card-foreground); margin-bottom: 5px; }
.ab-diff { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
@media (max-width: 680px) { .ab-diff { grid-template-columns: 1fr; } }
.ab-diff-col { border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
.ab-diff-col.chg { border-color: light-dark(#f59e0b, #b45309); }
.ab-diff-col .h { font-size: 11px; color: var(--muted-foreground); margin-bottom: 4px; }
.ab-diff-col .t { font-size: 12px; color: var(--card-foreground); white-space: pre-wrap; }
.ab-note { font-size: 12px; color: light-dark(#15803d, #4ade80); margin-top: 6px; }
</style>
<script>
(function () {
  var root = document.getElementById('ab-root');
  var boardEl = document.getElementById('ab-board');
  var detailEl = document.getElementById('ab-detail');
  var STATUS = [
    { id: '未开始', dot: 'var(--muted-foreground)' },
    { id: '进行中', dot: 'var(--primary)' },
    { id: '已阻塞', dot: 'light-dark(#b91c1c,#f87171)' },
    { id: '已完成', dot: 'light-dark(#15803d,#4ade80)' },
    { id: '已取消', dot: 'var(--muted-foreground)' }
  ];
  var MEM = [
    ['任务目标与范围', '在 DSH 内实现 Trello 式项目看板：卡片按状态分列，任务分配给对话完成。'],
    ['已确认的决策', '全宽看板视图取代浮层挂件；记忆仍须用户 diff 审核后确认；数据落盘 .dsh-kanban.json。'],
    ['已完成工作与进展', '数据层与记忆闭环已自测通过；UI 正在从浮层重构为全宽看板视图。'],
    ['关键产物与验证', '建议生命周期、版本链、过期规则均通过自测。'],
    ['未解决问题与风险', '卡片上的对话时间线信息粒度待确认；交接流程待跨会话验证。'],
    ['下一步', '确认看板形态后重构 UI，并在新对话中验证交接闭环。']
  ];
  var items = [
    { id: 'w1', title: 'AIKanBan for DSH 看板插件 v1', status: '进行中', goal: '把「任务分配给对话」的看板做成 DSH 全宽视图，替代浮层挂件', mem: 2, pending: 1, updated: '今天 09:10', confirmedNote: '',
      convs: [
        { name: '对齐需求并搭建数据层', time: '昨天 14:20', role: '推进', ctx: '最新', out: '任务记忆 V1（已确认）' },
        { name: 'UI 从浮层重构为看板视图', time: '今天 09:10', role: '推进', ctx: '已过期', out: '任务记忆 V3 建议（待审核）' }
      ] },
    { id: 'w2', title: '记忆建议过期规则验证', status: '已完成', goal: '确认旧建议自动过期且不可直接确认', mem: 2, pending: 0, updated: '周三 16:40',
      convs: [{ name: '过期规则自测', time: '周三 16:40', role: '验证', ctx: '最新', out: '任务记忆 V2（已确认）' }] },
    { id: 'w3', title: '对话上下文版本状态展示', status: '进行中', goal: '卡片上可视化每条对话收到的记忆版本状态', mem: 1, pending: 0, updated: '今天 11:02',
      convs: [{ name: '上下文版本 UI 梳理', time: '今天 11:02', role: '推进', ctx: '最新', out: '任务记忆 V1（已确认）' }] },
    { id: 'w4', title: '空状态与降级流程', status: '已阻塞', goal: '无记忆/无对话时核心流程仍可用', blocked: '待用户确认降级交互细节', mem: 3, pending: 0, updated: '周二 10:30',
      convs: [{ name: '空状态梳理', time: '周二 10:30', role: '推进', ctx: '未知', out: '任务记忆 V3（已确认）' }] },
    { id: 'w5', title: '早期浮层方案（废弃）', status: '已取消', goal: '被全宽看板视图方案替代', mem: 0, pending: 0, updated: '周二 09:00', convs: [] }
  ];
  var openId = null;

  function dot(status) {
    for (var i = 0; i < STATUS.length; i++) if (STATUS[i].id === status) return STATUS[i].dot;
    return 'var(--muted-foreground)';
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function pill(text, warn) {
    var p = el('span', 'ab-pill' + (warn ? ' warn' : ''), text);
    return p;
  }
  function find(id) { for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i]; return null; }

  function renderBoard() {
    boardEl.innerHTML = '';
    STATUS.forEach(function (st) {
      var col = el('div', 'ab-col');
      var list = items.filter(function (it) { return it.status === st.id; });
      var head = el('div', 'ab-col-head');
      var d = el('span', 'ab-dot'); d.style.background = st.dot;
      head.appendChild(d);
      head.appendChild(el('span', null, st.id));
      head.appendChild(el('span', 'ab-col-count', String(list.length)));
      col.appendChild(head);
      list.forEach(function (it) {
        var card = el('div', 'ab-card');
        card.appendChild(el('div', 'ab-card-title', it.title));
        card.appendChild(el('div', 'ab-card-goal', it.goal));
        var foot = el('div', 'ab-card-foot');
        foot.appendChild(pill('💬 对话 ×' + it.convs.length));
        foot.appendChild(pill('记忆 V' + it.mem));
        if (it.pending > 0) foot.appendChild(pill('待审核 ' + it.pending, true));
        foot.appendChild(el('span', null, it.updated));
        card.appendChild(foot);
        if (it.blocked) card.appendChild(el('div', 'ab-blocked', '阻塞：' + it.blocked));
        card.addEventListener('click', function () { openId = it.id; renderDetail(); });
        col.appendChild(card);
      });
      boardEl.appendChild(col);
    });
  }

  function renderDetail() {
    var it = find(openId);
    if (!it) return;
    boardEl.hidden = true;
    detailEl.hidden = false;
    detailEl.innerHTML = '';
    var back = el('div', 'ab-back');
    var b = el('button', 'btn btn-ghost', '← 返回看板');
    b.addEventListener('click', function () { detailEl.hidden = true; boardEl.hidden = false; renderBoard(); });
    back.appendChild(b);
    back.appendChild(el('span', 'ab-pill', it.status));
    back.appendChild(el('strong', null, it.title));
    detailEl.appendChild(back);

    var grid = el('div', 'ab-detail');

    var left = el('div');
    var p1 = el('div', 'ab-panel');
    p1.appendChild(el('h4', null, '工作项'));
    function kv(k, v) { var w = el('div', 'ab-kv'); w.appendChild(el('div', 'k', k)); w.appendChild(el('div', 'v', v)); return w; }
    p1.appendChild(kv('目标', it.goal));
    p1.appendChild(kv('当前进度', '数据层与记忆闭环已完成，UI 重构进行中'));
    p1.appendChild(kv('下一步', '确认看板形态 → 重构 UI → 新对话验证交接'));
    if (it.blocked) p1.appendChild(kv('阻塞原因', it.blocked));
    var row = el('div', 'ab-status-row');
    STATUS.forEach(function (st) {
      var s = el('button', 'btn ' + (st.id === it.status ? 'btn-primary' : 'btn-ghost'), st.id);
      s.addEventListener('click', function () { it.status = st.id; renderDetail(); renderBoard(); });
      row.appendChild(s);
    });
    p1.appendChild(row);
    left.appendChild(p1);

    var p2 = el('div', 'ab-panel');
    p2.appendChild(el('h4', null, '参与本任务的对话'));
    if (it.convs.length === 0) p2.appendChild(el('div', 'ab-kv', { } ).children[0] || el('div', 'ab-kv'));
    it.convs.forEach(function (c) {
      var box = el('div', 'ab-conv');
      box.appendChild(el('div', 'ab-conv-title', c.name));
      var meta = el('div', 'ab-conv-meta');
      meta.appendChild(el('span', null, c.time));
      meta.appendChild(pill('角色 · ' + c.role));
      var ctxCls = c.ctx === '最新' ? '' : ' warn';
      meta.appendChild(pill('上下文 ' + c.ctx, c.ctx !== '最新'));
      box.appendChild(meta);
      box.appendChild(el('div', 'ab-kv'));
      var out = el('div', 'ab-kv'); out.appendChild(el('div', 'k', '产出')); out.appendChild(el('div', 'v', c.out));
      box.appendChild(out);
      p2.appendChild(box);
    });
    left.appendChild(p2);
    grid.appendChild(left);

    var right = el('div');
    var p3 = el('div', 'ab-panel');
    p3.appendChild(el('h4', null, '任务记忆（最新 V' + it.mem + '）'));
    if (it.mem === 0) {
      p3.appendChild(el('div', 'ab-kv'));
      var empty = el('div', 'ab-kv'); empty.appendChild(el('div', 'v', '暂无已确认版本'));
      p3.appendChild(empty);
    } else {
      MEM.forEach(function (s) {
        var w = el('div', 'ab-kv'); w.appendChild(el('div', 'k', s[0])); w.appendChild(el('div', 'v', s[1])); p3.appendChild(w);
      });
    }
    right.appendChild(p3);

    if (it.pending > 0) {
      var p4 = el('div', 'ab-panel');
      p4.appendChild(el('h4', null, '待审核建议 · 基础 V' + it.mem));
      var df = el('div', 'ab-diff');
      var c1 = el('div', 'ab-diff-col');
      c1.appendChild(el('div', 'h', '基础版本 · 已完成工作与进展'));
      c1.appendChild(el('div', 't', '数据层与记忆闭环已自测通过。'));
      var c2 = el('div', 'ab-diff-col chg');
      c2.appendChild(el('div', 'h', '建议内容（有变化）'));
      c2.appendChild(el('div', 't', '数据层与记忆闭环已自测通过；UI 正在从浮层重构为全宽看板视图。'));
      df.appendChild(c1); df.appendChild(c2);
      p4.appendChild(df);
      var btnRow = el('div', 'ab-status-row');
      var ok = el('button', 'btn btn-primary', '确认（形成 V' + (it.mem + 1) + '）');
      var no = el('button', 'btn btn-ghost', '放弃建议');
      ok.addEventListener('click', function () {
        it.pending = 0; it.mem = it.mem + 1; it.confirmedNote = '已确认，形成任务记忆 V' + it.mem + ' ✓';
        it.convs[it.convs.length - 1].out = '任务记忆 V' + it.mem + '（已确认）';
        renderDetail(); renderBoard();
      });
      no.addEventListener('click', function () { it.pending = 0; it.confirmedNote = '建议已放弃'; renderDetail(); renderBoard(); });
      btnRow.appendChild(ok); btnRow.appendChild(no);
      p4.appendChild(btnRow);
      right.appendChild(p4);
    }
    if (it.confirmedNote) right.appendChild(el('div', 'ab-note', it.confirmedNote));
    grid.appendChild(right);
    detailEl.appendChild(grid);
  }

  document.getElementById('ab-new').addEventListener('click', function () {
    items.unshift({ id: 'w' + Date.now(), title: '新工作项（示例）', status: '未开始', goal: '在对话框中要求 agent 创建，或在此填写标题与目标', mem: 0, pending: 0, updated: '刚刚', convs: [] });
    renderBoard();
  });
  document.getElementById('ab-handoff').addEventListener('click', function () {
    alert('交接上下文 = 最新项目记忆 + 工作项字段 + 最新任务记忆 + 一次性说明\n（新 DSH 会话粘贴使用，或由 agent 用工具读取）');
  });

  renderBoard();
})();
</script>
